<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <rect width="800" height="320" fill="#111827" rx="18"/>
  <text x="40" y="60" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="24">Install on device</text>
  <rect x="40" y="90" width="720" height="190" fill="#1f2937" rx="12"/>
  <text x="60" y="130" fill="#9ca3af" font-family="monospace" font-size="18">scp emt.moeite.xinamine_0.0.1_iphoneos-arm64e.deb root@device:/tmp/</text>
  <text x="60" y="160" fill="#9ca3af" font-family="monospace" font-size="18">ssh root@device</text>
  <text x="60" y="190" fill="#34d399" font-family="monospace" font-size="18">dpkg -i /tmp/emt.moeite.xinamine_0.0.1_iphoneos-arm64e.deb</text>
  <text x="60" y="220" fill="#38bdf8" font-family="monospace" font-size="18">Setting up emt.moeite.xinamine (0.0.1)</text>
  <text x="60" y="250" fill="#f8fafc" font-family="monospace" font-size="18">Done. Please respring if needed.</text>
</svg>